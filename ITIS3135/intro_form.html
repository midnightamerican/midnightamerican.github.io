<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Introduction Form | Michel Donovan Saint Remy</title>
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles/default.css" />
  </head>

  <body>
    <div data-include="Components/header.html"></div>

    <main>
      <h2>Introduction Form</h2>
      <h3>Please submit the form below.</h3>

      <form id="form">

        <!-- NAME -->
        <label>First Name
          <input type="text" value="Michel" required />
        </label>

        <label>Middle Name
          <input type="text" value="Donovan" />
        </label>

        <label>Last Name
          <input type="text" value="Saint Remy" required />
        </label>

        <label>Mascot Adjective
          <input type="text" value="Metaphysical" required />
        </label>

        <label>Mascot Animal
          <input type="text" value="Dolphin" required />
        </label>

        <label>Divider
          <input type="text" value="|" required />
        </label>

        <!-- ACKNOWLEDGMENT -->
        <label>Acknowledgment
          <textarea required>
I understand that what I put here is publicly available on the web.
          </textarea>
        </label>

        <label>Date
          <input type="text" value="4/15/2026" required />
        </label>

        <!-- IMAGE -->
        <label>Upload Image
          <input type="file" accept="image/*" />
        </label>

        <label>Image Caption
          <input type="text" value="Me at my first NFL game" />
        </label>

        <!-- INTRO -->
        <label>Personal Statement
          <textarea required>
I am a junior at UNC Charlotte studying Cybersecurity.
          </textarea>
        </label>

        <label>Background
          <textarea required>
I enjoy sports, friends, and traveling.
          </textarea>
        </label>

        <label>Academic Background
          <textarea required>
Longleaf High School graduate, UNC Charlotte student.
          </textarea>
        </label>

        <label>Professional Background
          <textarea required>
Domino’s, Regal Movies, Charlotte Football, RA.
          </textarea>
        </label>

        <label>Goals
          <textarea required>
Cybersecurity career path.
          </textarea>
        </label>

        <label>Subject Background
          <textarea required>
Small sports data projects and predictive models.
          </textarea>
        </label>

        <label>Primary Computer
          <textarea required>
Custom PC (Ryzen 7 9700X, Intel Arc A750, 32GB RAM)
          </textarea>
        </label>

        <label>Backup Computer
          <textarea required>
Mac + Dell Inspiron 3880
          </textarea>
        </label>

        <label>Fun Fact
          <textarea>
I play Charlotte Flag Football.
          </textarea>
        </label>

        <label>Share
          <textarea>
I love football.
          </textarea>
        </label>

        <!-- COURSES (MATCHES CSS #courses) -->
        <section>
          <h3>Courses</h3>

          <div id="courses">

            <div class="course-entry">
              <input value="ITIS" required />
              <input value="3135" required />
              <input value="Web Development" required />
              <input value="Required course" required />
              <button type="button">Delete</button>
            </div>

            <div class="course-entry">
              <input value="ITIS" />
              <input value="3200" />
              <input value="Privacy & Security" />
              <input value="Major requirement" />
              <button type="button">Delete</button>
            </div>

            <div class="course-entry">
              <input value="ITSC" />
              <input value="3155" />
              <input value="Software Engineering" />
              <input value="Major requirement" />
              <button type="button">Delete</button>
            </div>

            <div class="course-entry">
              <input value="POLS" />
              <input value="3380" />
              <input value="Security in Democracy" />
              <input value="Minor requirement" />
              <button type="button">Delete</button>
            </div>

            <div class="course-entry">
              <input value="POLS" />
              <input value="3382" />
              <input value="Analytical Writing" />
              <input value="Minor requirement" />
              <button type="button">Delete</button>
            </div>

          </div>

          <button type="button" id="addCourse">Add Course</button>
        </section>

        <!-- QUOTE -->
        <label>Quote
          <input type="text" value="“Listening, it's a skill”" />
        </label>

        <label>Author
          <input type="text" value="Ryan Osborn" />
        </label>

        <!-- LINKS -->
        <label>GitHub
          <input type="url" value="midnightamerican.github.com" />
        </label>

        <label>LinkedIn
          <input type="url" value="www.linkedin.com/in/michel-st-remy" placeholder="Enter linkedin url" required/>
        </label>

        <!-- RESULT -->
        <div id="result"></div>

        <!-- BUTTONS (MATCH CSS IDS) -->
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        <button type="button" id="clearBtn">Clear</button>
        <button type="button" id="generateJSON">Generate JSON</button>
        <button type="button" id="generateHTML">Generate HTML</button>

      </form>
    </main>
    <div data-include="Components/footer.html"></div>
    <script src="scripts/include.min.js"></script>
  </body>
</html>
