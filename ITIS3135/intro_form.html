<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Introduction Form | Michel Donovan Saint Remy</title>

    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="styles/default.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/default.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  </head>

  <body>
    <div data-include="Components/header.html"></div>

    <main>
      <h2>Introduction Form</h2>
      <h3>Please submit the form below.</h3>

      <form id="form">

        <!-- NAME -->
        <label>First Name
          <input name="firstName" type="text" value="Michel" required />
        </label>

        <label>Middle Name
          <input name="middleName" type="text" value="Donovan" />
        </label>

        <label>Last Name
          <input name="lastName" type="text" value="Saint Remy" required />
        </label>

        <label>Mascot Adjective
          <input name="mascotAdjective" type="text" value="Metaphysical" required />
        </label>

        <label>Mascot Animal
          <input name="mascotAnimal" type="text" value="Dolphin" required />
        </label>

        <label>Divider
          <input name="divider" type="text" value="|" required />
        </label>

        <!-- ACKNOWLEDGMENT -->
        <label>Acknowledgment
          <textarea name="acknowledgment" required>
I understand that what I put here is publicly available on the web.
          </textarea>
        </label>

        <label>Date
          <input name="ackDate" type="text" value="4/15/2026" required />
        </label>

        <!-- IMAGE -->
        <label>Upload Image
          <input name="image" type="file" accept="image/*" />
        </label>

        <label>Image Caption
          <input name="imageCaption" type="text" value="Me at my first NFL game" />
        </label>

        <!-- INTRO -->
        <label>Personal Statement
          <textarea name="personalStatement" required>
I am a junior at UNC Charlotte studying Cybersecurity.
          </textarea>
        </label>

        <label>Background
          <textarea name="personalBackground" required>
I enjoy sports, friends, and traveling.
          </textarea>
        </label>

        <label>Academic Background
          <textarea name="academicBackground" required>
Longleaf High School graduate, UNC Charlotte student.
          </textarea>
        </label>

        <label>Professional Background
          <textarea name="professionalBackground" required>
Domino’s, Regal Movies, Charlotte Football, RA.
          </textarea>
        </label>

        <label>Goals
          <textarea name="careerGoals" required>
Cybersecurity career path.
          </textarea>
        </label>

        <label>Subject Background
          <textarea name="subjectBackground" required>
Small sports data projects and predictive models.
          </textarea>
        </label>

        <label>Primary Computer
          <textarea name="primaryComputer" required>
Custom PC (Ryzen 7 9700X, Intel Arc A750, 32GB RAM)
          </textarea>
        </label>

        <label>Backup Computer
          <textarea name="backupComputer" required>
Mac + Dell Inspiron 3880
          </textarea>
        </label>

        <label>Fun Fact
          <textarea name="funnyThing">
I play Charlotte Flag Football.
          </textarea>
        </label>

        <label>Share
          <textarea name="share">
I love football.
          </textarea>
        </label>

        <!-- COURSES -->
        <section>
          <h3>Courses</h3>

          <div id="courses">

            <div class="course-entry">
              <input name="courseDept" value="ITIS" required />
              <input name="courseNum" value="3135" required />
              <input name="courseName" value="Web Development" required />
              <input name="courseReason" value="Required course" required />
              <button type="button" class="delete-button">Delete</button>
            </div>

            <div class="course-entry">
              <input name="courseDept" value="ITIS" />
              <input name="courseNum" value="3200" />
              <input name="courseName" value="Privacy & Security" />
              <input name="courseReason" value="Major requirement" />
              <button type="button" class="delete-button">Delete</button>
            </div>

            <div class="course-entry">
              <input name="courseDept" value="ITSC" />
              <input name="courseNum" value="3155" />
              <input name="courseName" value="Software Engineering" />
              <input name="courseReason" value="Major requirement" />
              <button type="button" class="delete-button">Delete</button>
            </div>

            <div class="course-entry">
              <input name="courseDept" value="POLS" />
              <input name="courseNum" value="3380" />
              <input name="courseName" value="Security in Democracy" />
              <input name="courseReason" value="Minor requirement" />
              <button type="button" class="delete-button">Delete</button>
            </div>

            <div class="course-entry">
              <input name="courseDept" value="POLS" />
              <input name="courseNum" value="3382" />
              <input name="courseName" value="Analytical Writing" />
              <input name="courseReason" value="Minor requirement" />
              <button type="button" class="delete-button">Delete</button>
            </div>

          </div>

          <button type="button" id="addCourse">Add Course</button>
        </section>

        <!-- QUOTE -->
        <label>Quote
          <input name="quote" type="text" value="Listening, it's a skill" />
        </label>

        <label>Author
          <input name="quoteAuthor" type="text" value="Ryan Osborn" />
        </label>

        <!-- LINKS -->
        <label>GitHub
          <input name="github" type="url" value="https://www.midnightamerican.github.com" />
        </label>

        <label>LinkedIn
          <input name="linkedin" type="url" value="https://www.linkedin.com/in/michel-st-remy" required />
        </label>

        
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        <button type="button" id="clearBtn">Clear</button>
        <button type="button" id="generateJSON">Generate JSON</button>
        <button type="button" id="generateHTML">Generate HTML</button>

      </form>
    <div id="result"></div>
    </main>

    <div data-include="Components/footer.html"></div>

    <script src="scripts/introduction.js"></script>
    <script src="scripts/generate_json.js"></script>
    <script src="scripts/generate_html.js"></script>
    <script src="scripts/include.min.js"></script>

  </body>
</html>
