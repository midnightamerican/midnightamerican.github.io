<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards</title>

    <link rel="stylesheet" href="styles/default.css">
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>

<body>

<div data-include="Components/header.html"></div>

<h1>Dolphin Deck</h1>

<main id="playing-cards">

    <div class="playing-card">
        <div class="left">A ♠</div>
        <div class="middle">
            <span class="dolphin">🐬</span>
            <span>♠</span>
        </div>
        <div class="right">A ♠</div>
    </div>

    <div class="playing-card">
        <div class="left">K ♥</div>
        <div class="middle">
            <span class="dolphin">🐬</span>
            <span>♥</span>
        </div>
        <div class="right">K ♥</div>
    </div>

    <div class="playing-card">
        <div class="left">Q ♦</div>
        <div class="middle">
            <span class="dolphin">🐬</span>
            <span>♦</span>
        </div>
        <div class="right">Q ♦</div>
    </div>

    <div class="playing-card">
        <div class="left">J ♣</div>
        <div class="middle">
            <span class="dolphin">🐬</span>
            <span>♣</span>
        </div>
        <div class="right">J ♣</div>
    </div>

    <div class="playing-card">
        <div class="left">10 ♠</div>
        <div class="middle">
            <span class="dolphin">🐬</span>
            <span>♠</span>
        </div>
        <div class="right">10 ♠</div>
    </div>

</main>

<div data-include="Components/footer.html"></div>
<script src="scripts/include.min.js"></script>

</body>
</html>
