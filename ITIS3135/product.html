<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Landing Page</title>

    <link rel="stylesheet" href="styles/default.css">
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>

<body>

<div data-include="Components/header.html"></div>

<main class="landing-page">

    <div class="card-container">

        <!-- HERO -->
        <section class="hero-card">
            <h1>Elite Performance Footballs</h1>
            <p>Built for power, precision, and game-winning plays.</p>
        </section>

        <!-- FEATURES -->
        <section id="features" class="feature-grid">

            <div class="feature">
                <h3>🏈 Pro Grip</h3>
                <p>Maximum control in all conditions.</p>
            </div>

            <div class="feature">
                <h3>💪 Durable</h3>
                <p>Designed for intense gameplay.</p>
            </div>

            <div class="feature">
                <h3>🎯 Accuracy</h3>
                <p>Engineered for perfect throws.</p>
            </div>

        </section>

        <!-- PRICING -->
        <section class="pricing-grid">

            <div class="pricing-card">
                <h3>Starter Ball</h3>
                <p>$19.99</p>
            </div>

            <div class="pricing-card">
                <h3>Pro Ball</h3>
                <p>$39.99</p>
            </div>

            <div class="pricing-card">
                <h3>Elite Ball</h3>
                <p>$59.99</p>
            </div>

        </section>

        <!-- FORM -->
        <section id="contact">
            <h2>Join Our Team</h2>

            <form id="form" action="https://www.freecodecamp.org/email-submit">
                <input 
                    id="email"
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <button type="submit">Get Started</button>
            </form>
        </section>

    </div>

</main>

<div data-include="Components/footer.html"></div>
<script src="scripts/include.min.js"></script>

</body>
</html>
